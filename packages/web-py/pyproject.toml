# ffwf-tau-web: tau-code's web client, built, as a Python package `tau_web` that τ serves.
#
# Data only: `tau_web/dist/` is packages/web/dist without its sourcemaps, copied in by
# scripts/build-web-wheel.mjs, which also writes `tau_web/_built.py` (the protocol the client
# speaks). Neither is committed, so this directory does not build on its own: run
# `npm run package:web-wheel` from the repository root. The sdist carries both, so building a wheel from the sdist needs no Node.
#
# THE VERSION IS τ'S, NOT tau-code's. ffwf-tau-web 0.17.x speaks protocol 2 and pairs with
# ffwf-tau 0.17.x; 0.18.x speaks protocol 3 and pairs with ffwf-tau 0.18.x; ffwf-tau depends on this package, so there is deliberately no dependency on
# ffwf-tau here (it would be circular). Release order: ffwf-tau-web first, then ffwf-tau.
[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ffwf-tau-web"
version = "0.18.0"
description = "tau-code's web client, built, for `tau serve` to serve with no flags."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Fight Fire with Fire Robotics, LLC" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: JavaScript",
  "Environment :: Web Environment",
]

[project.urls]
Source = "https://github.com/jmccardle/tau-code"

[tool.hatch.build]
# Generated by the build script and gitignored, which hatchling would otherwise leave out.
artifacts = ["src/tau_web/dist/**", "src/tau_web/_built.py", "LICENSE"]

[tool.hatch.build.targets.sdist]
include = ["src/tau_web", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/tau_web"]
